[package]
name = "suckpaper_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
# windows = "0.62.2"
windows-sys = {version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
winit = "0.30.13"
raw-window-handle = "0.6.2" # Already used in winit
wgpu = "30.0.2"

egui = "0.37.0"
egui-winit = "0.37.0"
egui-wgpu = "0.37.0"
rfd = "0.18.0"

env_logger = "0.11.11"
log = "0.4.35"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = [ "derive" ] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"]}
tray-icon = "0.26.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1